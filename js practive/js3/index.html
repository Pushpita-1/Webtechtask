<!DOCTYPE html>
<html>

<head>
    
    <title>Dark & Light Mode</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            margin:0;
            text-align:center;
        }

        header, main, footer{
            padding:30px;
            border:2px solid black;
            margin:10px;
        }

        button{
            padding:10px 20px;
            margin:20px;
           
        }
    </style>
</head>

<body>

<header id="header">
    <h1>My Portfolio</h1>
</header>

<button id="btn" onclick="changeMode()">Switch to Dark Mode</button>

<main id="content">
    <h2>Welcome</h2>
    <p>This is my portfolio website.</p>
</main>

<footer id="footer">
    <p>&copy; 2025 My Portfolio</p>
</footer>

<script>

let darkMode = false;

function changeMode(){

    if(darkMode == false){

        document.body.style.backgroundColor = "black";
        document.body.style.color = "white";

        document.getElementById("header").style.backgroundColor = "#333";
        document.getElementById("content").style.backgroundColor = "#444";
        document.getElementById("footer").style.backgroundColor = "#333";

        document.getElementById("header").style.border = "2px solid white";
        document.getElementById("content").style.border = "2px solid white";
        document.getElementById("footer").style.border = "2px solid white";

        document.getElementById("btn").innerText = "Switch to Light Mode";

        darkMode = true;
    }

    else{

        document.body.style.backgroundColor = "white";
        document.body.style.color = "black";

        document.getElementById("header").style.backgroundColor = "white";
        document.getElementById("content").style.backgroundColor = "white";
        document.getElementById("footer").style.backgroundColor = "white";

        document.getElementById("header").style.border = "2px solid black";
        document.getElementById("content").style.border = "2px solid black";
        document.getElementById("footer").style.border = "2px solid black";

        document.getElementById("btn").innerText = "Switch to Dark Mode";

        darkMode = false;
    }

}

</script>

</body>
</html>
