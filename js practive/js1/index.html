<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>

    <style>
        body{
            font-family: Arial, sans-serif;
        }

        form{
            width:400px;
            margin:auto;
            border:1px solid black;
            padding:30px;
        }

        input{
            width:100%;
            padding:8px;
            margin-bottom:10px;
        }

        .error{
            color:red;
            font-size:14px;
        }

        #success{
            color:green;
            font-weight:bold;
        }
    </style>
</head>
<body>

<h2 align="center">Student Registration Form</h2>

<form id="registerForm">

    <label>Full Name</label><br>
    <input type="text" id="name">
    <div class="error" id="nameError"></div>

    <label>Email</label><br>
    <input type="text" id="email">
    <div class="error" id="emailError"></div>

    <label>Password</label><br>
    <input type="password" id="password">
    <div class="error" id="passwordError"></div>

    <label>Confirm Password</label><br>
    <input type="password" id="confirmPassword">
    <div class="error" id="confirmError"></div>

    <label>Phone Number</label><br>
    <input type="text" id="phone">
    <div class="error" id="phoneError"></div>

    <br>

    <input type="submit" value="Register">

    <p id="success"></p>

</form>

<script>

document.getElementById("registerForm").addEventListener("submit", function(event){

    event.preventDefault();

    document.getElementById("nameError").innerText="";
    document.getElementById("emailError").innerText="";
    document.getElementById("passwordError").innerText="";
    document.getElementById("confirmError").innerText="";
    document.getElementById("phoneError").innerText="";
    document.getElementById("success").innerText="";

    let name=document.getElementById("name").value;
    let email=document.getElementById("email").value;
    let password=document.getElementById("password").value;
    let confirm=document.getElementById("confirmPassword").value;
    let phone=document.getElementById("phone").value;

    let valid=true;

    if(name==""){
        document.getElementById("nameError").innerText="Name is required";
        valid=false;
    }

    if(email.indexOf("@")==-1 || email.indexOf(".")==-1){
        document.getElementById("emailError").innerText="Invalid Email";
        valid=false;
    }

    if(password.length<6){
        document.getElementById("passwordError").innerText="Password must be at least 6 characters";
        valid=false;
    }

    if(password!=confirm){
        document.getElementById("confirmError").innerText="Passwords do not match";
        valid=false;
    }

    if(isNaN(phone)){
        document.getElementById("phoneError").innerText="Phone must contain only digits";
        valid=false;
    }

    if(phone==""){
        document.getElementById("phoneError").innerHTML="Phone no needed"
        valid=false;

    }

    if(valid){
        document.getElementById("success").innerText="Registration Successful!";
    }

});

</script>

</body>
</html>
