<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Floating Contact Widget</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            height: 1500px;
        }

        .contact-box{
            position: fixed;
            bottom: 20px;
            right: 20px;

            background-color: lightblue;
            border: 2px solid black;
            padding: 15px 30px;
              z-index:1;
        }

        .contact-box:hover{
            background-color: lightgreen;
        }

        .contact-box a{
            text-decoration: none;
            color: blue;
        }

    </style>

</head>

<body>

    <h1>Company Website</h1>

    <p>
        hi
    </p>

    <div class="contact-box">

        <h3>Contact Us</h3>

        <p>☎️ +880 1712345678</p>

        <p>
            📧
            <a href="info@company.com">
                info@company.com
            </a>
        </p>

    </div>

</body>

</html>
