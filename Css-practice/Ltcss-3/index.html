<!DOCTYPE html>


<head>
    <meta charset="UTF-8">
    <title>Company Navigation Bar</title>

    <style>

        nav{
            background-color: navy;
            width:100%;
            
            text-align: center;
            padding:15px;
        }

        nav a{
            
            
            text-decoration:none;
            color:white;
            padding:10px 20px;
            margin:5px;
        }

        nav a:hover{
            background-color:brown;
            color:black;
        }

    </style>

</head>

<body>

    <nav>

        <a href="#">Home</a>

        <a href="#">About</a>

        <a href="#">Services</a>

        <a href="#">Gallery</a>

        <a href="#">Contact</a>

    </nav>

</body>

</html>
