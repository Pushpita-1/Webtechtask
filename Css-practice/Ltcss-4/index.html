<!DOCTYPE html>
<html>

<head>
    
    <title>Product Display</title>

    <style>

        body{
            text-align:center;
            background-color:#f5f5f5;
        }

        .product{
            display:inline-block;
          
            border:2px solid black;
            background-color:white;
            padding:15px;
            margin:20px;
            text-align:center;
        }

        .product:hover{
            outline:3px solid blue;
            outline-offset:2px;
        }

        .product img{
            width:150px;
            height:150px;
        }

        a{
            text-decoration:none;
            color:blue;
        }


        .product button:hover{
background-color: black;
color: azure;

        }

    </style>

</head>

<body>

    <h1>Online Store</h1>

    <div class="product">

        <img src="https://via.placeholder.com/150" alt="Laptop">

        <h2>Laptop</h2>

        <p>Intel Core i7, 16GB RAM, 512GB SSD.</p>

        <h3>$899</h3>

        <button><a href="#">Buy Now</a></button>

    </div>

    <div class="product">

        <img src="https://via.placeholder.com/150" alt="Headphones">

        <h2>Headphones</h2>

        <p>Wireless Bluetooth with Noise Cancellation.</p>

        <h3>$149</h3>

        <button><a href="#">Buy Now</a></button>

    </div>

    <div class="product">

        <img src="https://via.placeholder.com/150" alt="Smartwatch">
        <h2>Smartwatch</h2>
<p>Fitness Tracking and Heart Rate Monitor.</p>

        <h3>$199</h3>

        <button><a href="#">Buy Now</a></button>

    </div>

</body>

</html>
