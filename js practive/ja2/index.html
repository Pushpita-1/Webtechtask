<!DOCTYPE html>
<html >
<head>

<title>Real-Time Clock</title>

<style>

body{
    font-family: Arial;
    text-align: center;
}

#clock{
    width: 250px;
    margin: 100px auto;
    padding: 20px;
    border: 2px solid black;
    font-size: 35px;
    font-weight: bold;
}

</style>

</head>
<body>

<h2>Digital Clock</h2>

<div id="clock"></div>

<script>

function showTime(){

    let now = new Date();

    let hours = now.getHours();
    let minutes = now.getMinutes();
    let seconds = now.getSeconds();

    let ampm = "AM";

    if(hours >= 12){
        ampm = "PM";
    }

    if(hours > 12){
        hours = hours - 12;
    }

    if(hours == 0){
        hours = 12;
    }

    if(hours < 10){
        hours = "0" + hours;
    }

    if(minutes < 10){
        minutes = "0" + minutes;
    }

    if(seconds < 10){
        seconds = "0" + seconds;
    }

    document.getElementById("clock").innerText =
    hours + ":" + minutes + ":" + seconds + " " + ampm;

}

setInterval(showTime,1000);

showTime();

</script>

</body>
</html>
