<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Layered Elements Using Z-index</title>

<style>

body{
    font-family: Arial, sans-serif;
}

/* Parent Container */
.container{
    position: relative;
    width: 500px;
    height: 350px;
    margin: 50px auto;
    border: 2px solid black;
}

/* Common Style */
.box{
    position: absolute;
    width: 180px;
    height: 120px;
    color: white;
    text-align: center;
    line-height: 120px;
    font-size: 22px;
    font-weight: bold;
}

/* Box 1 */
.box1{
    background-color: red;
    top: 20px;
    left: 20px;
    z-index: 1;
}

/* Box 2 */
.box2{
    background-color: blue;
    top: 60px;
    left: 80px;
    z-index: 2;
}

/* Box 3 */
.box3{
    background-color: green;
    top: 100px;
    left: 140px;
    z-index: 3;
}

</style>

</head>
<body>

<h2 style="text-align:center;">Layered Elements Using Z-index</h2>

<div class="container">

    <div class="box box1">
        Box 1
    </div>

    <div class="box box2">
        Box 2
    </div>

    <div class="box box3">
        Box 3
    </div>

</div>

</body>
</html>
